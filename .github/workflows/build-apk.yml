name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Bundle hls.js (offline inside the app)
        run: |
          mkdir -p www/vendor
          cp node_modules/hls.js/dist/hls.min.js www/vendor/hls.min.js

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icon and splash sources
        run: |
          pip install pillow
          python make_icons.py

      - name: Generate Android icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ArabCine.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabCine-APK
          path: ArabCine.apk

      - name: Publish release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: السينما موبايل - بناء ${{ github.run_number }}
          files: ArabCine.apk
